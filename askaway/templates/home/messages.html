<style>
    .messages-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1000;
        max-width: 25rem;
    }

    .message {
        margin-bottom: 0.75rem;
        padding: 1rem;
        border-radius: 0.375rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        animation: slide-in 0.3s ease-out forwards;
    }

    .message-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .message-text {
        margin-right: 1rem;
    }

    .message-close {
        background: transparent;
        border: none;
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s;
    }

    .message-close:hover {
        opacity: 1;
    }

    /* Message types */
    .message-debug {
        background-color: #f3f4f6;
        color: #1f2937;
    }

    .message-info {
        background-color: #e0f2fe;
        color: #0369a1;
    }

    .message-success {
        background-color: #dcfce7;
        color: #166534;
    }

    .message-warning {
        background-color: #fef3c7;
        color: #92400e;
    }

    .message-error {
        background-color: #fee2e2;
        color: #b91c1c;
    }

    /* Animations */
    @keyframes slide-in {
        from {
            transform: translateX(100%);
            opacity: 0;
        }

        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes fade-out {
        from {
            opacity: 1;
        }

        to {
            opacity: 0;
        }
    }

    .fade-out {
        animation: fade-out 0.5s ease-out forwards;
    }
</style>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Get all messages
        const messages = document.querySelectorAll('.message');

        // Auto-dismiss messages after 5 seconds (5000ms)
        messages.forEach(function (message) {
            // Set timeout to add fade-out class
            setTimeout(function () {
                message.classList.add('fade-out');

                // Remove message after animation completes
                setTimeout(function () {
                    message.remove();
                }, 500); // Match this to your fade-out animation duration
            }, 5000); // Time before message starts to fade

            // Add click handler to close button
            const closeButton = message.querySelector('.message-close');
            if (closeButton) {
                closeButton.addEventListener('click', function () {
                    message.classList.add('fade-out');
                    setTimeout(function () {
                        message.remove();
                    }, 500);
                });
            }
        });
    });


</script>

<div class="messages-container">
    {% if messages %}
    {% for message in messages %}
    <div class="message message-{{ message.tags }} fade-message" role="alert">
        <div class="message-content">
            <span class="message-text">{{ message }}</span>
            <button type="button" class="message-close" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    </div>
    {% endfor %}
    {% endif %}
</div>
