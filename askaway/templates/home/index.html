<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskAway</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* Base styles */
        :root {
            --brand-color: #6366f1;
            --brand-dark: #4f46e5;
            --gray-600: #4b5563;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Header styles */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--white);
            border-bottom: 1px solid #e5e7eb;
            box-shadow: var(--shadow-sm);
            padding: 0.75rem 0;
        }

        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--brand-color);
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo-light {
            font-weight: 200;
        }

        /* Desktop Navigation */
        .desktop-nav {
            display: none;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--gray-600);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--brand-color);
        }

        .nav-link svg {
            width: 1rem;
            height: 1rem;
        }

        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.875rem;
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #d1d5db;
            color: #374151;
        }

        .btn-outline:hover {
            background-color: #f9fafb;
        }

        .btn-primary {
            background-color: var(--brand-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--brand-dark);
        }

        .btn-full {
            width: 100%;
            justify-content: center;
        }

        /* Mobile Menu Button */
        .mobile-menu-button {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 2rem;
            height: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .mobile-menu-button span {
            display: block;
            width: 1.5rem;
            height: 0.125rem;
            background-color: var(--gray-600);
        }

        /* Mobile Menu */
        .mobile-menu {
            display: none;
            position: absolute;
            top: 3.5rem;
            left: 0;
            right: 0;
            background-color: var(--white);
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            z-index: 20;
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0 1rem;
        }

        .mobile-nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray-600);
            text-decoration: none;
            padding: 0.5rem 0;
        }

        .mobile-auth-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* Media Queries */
        @media (min-width: 768px) {
            .desktop-nav {
                display: flex;
            }

            .mobile-menu-button {
                display: none;
            }

            .mobile-menu {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container">
            <!-- Logo -->
            <a href="/" class="logo">
                Ask<span class="logo-light">Away</span>
            </a>

            <!-- Desktop Navigation -->
            <div class="desktop-nav">
                <nav class="nav-links">
                    <a href="/" class="nav-link">
                        <i data-feather="home"></i>
                        <span>Home</span>
                    </a>
                    <a href="{% url 'question:question_list' %}" class="nav-link">
                        <i data-feather="pen-square"></i>
                        <span>Ask Question</span>
                    </a>
                </nav>
                <div class="auth-buttons">
                    <!-- Logged in state (uncomment when user is logged in) -->
                    <!--
                    <a href="/profile" class="nav-link">
                        <i data-feather="user"></i>
                        <span>Username</span>
                    </a>
                    <button class="btn btn-outline btn-sm" id="logout-btn">
                        <i data-feather="log-out"></i>
                        <span>Logout</span>
                    </button>
                    -->

                    <!-- Logged out state -->
                    {% if user.is_authenticated %}
                    <span class="nav-link">{{user.username}}</span>
                    <form action="{% url 'authentication:logout' %}" method="post">
                        <button class="btn btn-outline btn-sm" id="logout-btn" type="submit">Logout</button>
                        {% csrf_token %}
                    </form>
                    {% else %}
                    <a class="nav-link" id="login-btn" href="{% url 'authentication:login' %}">Login</a>
                    <a class="nav-link" id="signup-btn" href="{% url 'authentication:signup' %}">Sign Up</a>
                    {% endif %}
                </div>
            </div>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-button" id="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Mobile Menu (hidden by default) -->
            <div class="mobile-menu" id="mobile-menu">
                <div class="mobile-menu-container">
                    <a href="/" class="mobile-nav-link">
                        <i data-feather="home"></i>
                        <span>Home</span>
                    </a>
                    <a href="/ask" class="mobile-nav-link">
                        <i data-feather="pen-square"></i>
                        <span>Ask Question</span>
                    </a>
                    <div class="mobile-auth-section">
                        <!-- Logged in state (uncomment when user is logged in) -->
                        <!--
                        <a href="/profile" class="mobile-nav-link">
                            <i data-feather="user"></i>
                            <span>Username</span>
                        </a>
                        <button class="btn btn-outline btn-full" id="mobile-logout-btn">
                            <i data-feather="log-out"></i>
                            <span>Logout</span>
                        </button>
                        -->

                        <!-- Logged out state -->
                        <button class="btn btn-outline btn-full" id="mobile-login-btn">Login</button>
                        <button class="btn btn-primary btn-full" id="mobile-signup-btn">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    {% block content %}

    {% include 'home/content.html' %}

    {% endblock %}

    {% block messages %}
    {% include 'home/messages.html' %}
    {% endblock %}

    <script>
        // Initialize Feather icons
        feather.replace();

        // Mobile menu toggle
        document.getElementById('mobile-menu-toggle').addEventListener('click', function () {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('active');
        });

        // Button event listeners
        document.getElementById('login-btn').addEventListener('click', function () {
            window.location.href = '/login';
        });

        document.getElementById('signup-btn').addEventListener('click', function () {
            window.location.href = '/signup';
        });

        document.getElementById('mobile-login-btn').addEventListener('click', function () {
            window.location.href = '/login';
        });

        document.getElementById('mobile-signup-btn').addEventListener('click', function () {
            window.location.href = '/signup';
        });

        // Uncomment when implementing logout functionality
        /*
        document.getElementById('logout-btn').addEventListener('click', function() {
            // Logout logic here
        });
        
        document.getElementById('mobile-logout-btn').addEventListener('click', function() {
            // Logout logic here
        });
        */
    </script>
</body>

</html>
